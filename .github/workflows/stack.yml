name: Release stack
on:
  push:
    branches: [release/stack-candidate]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  installed-stack:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ['3.11', '3.14']
        profile: [native, fallback]
        dependencies: [latest]
        include:
          - {os: ubuntu-latest, python: '3.11', profile: native, dependencies: minimum}
          - {os: ubuntu-latest, python: '3.11', profile: fallback, dependencies: minimum}
    env:
      ALGROOTS_BUILD_NATIVE_F4: ${{ matrix.profile == 'native' && '1' || '0' }}
      ALGROOTS_BUILD_FF_SPARSE: ${{ matrix.profile == 'native' && '1' || '0' }}
      ALGROOTS_BUILD_NATIVE_EXTENSION: ${{ matrix.profile == 'native' && '1' || '0' }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Select tested arithmetic floors
        if: matrix.dependencies == 'minimum'
        shell: bash
        run: echo "PIP_CONSTRAINT=$GITHUB_WORKSPACE/ci/stack-minimum-dependencies.txt" >> "$GITHUB_ENV"
      - name: Install validation tools and selected integrations
        run: python -m pip install build 'setuptools>=77' wheel pytest pytest-cov pytest-timeout hypothesis nbclient nbformat ipykernel matplotlib PyYAML 'tensoratlas>=0.2.0' pandas
      - if: matrix.dependencies == 'latest'
        run: python -m pip install cvxpy clarabel scs
      - if: matrix.profile == 'native'
        uses: ./.github/actions/native-dependencies
      - if: runner.os == 'Linux'
        run: python -m pip install auditwheel
      - if: runner.os == 'macOS'
        run: python -m pip install delocate
      - if: runner.os == 'Windows'
        run: python -m pip install delvewheel
      - name: Fetch frozen package sources
        run: python tools/fetch_release_sources.py --output '${{ runner.temp }}/algebra-stack'
      - name: Validate installed distributions and full suites
        run: python tools/validate_release_stack.py --source-root '${{ runner.temp }}/algebra-stack' --output '${{ runner.temp }}/stack-validation' --tests ${{ matrix.profile == 'native' && '--native' || '' }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stack-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.profile }}-${{ matrix.dependencies }}
          path: ${{ runner.temp }}/stack-validation
