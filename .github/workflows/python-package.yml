name: Test, Build, and Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        exclude:
          # Keep macOS/Windows coverage useful without multiplying CI cost
          # unnecessarily. Linux still exercises every supported Python.
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run test suite
        run: python -m pytest -ra

  quality:
    name: Lint, format, coverage, and docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: python -m pip install -e ".[test,dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff formatting
        run: ruff format --check .

      - name: Compile Python sources
        run: python -m compileall -q src tests tools

      - name: Run tests with branch coverage
        run: >
          python -m pytest
          --cov=algroots
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    needs:
      - test
      - quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tools
        run: >
          python -m pip install
          --upgrade
          build
          twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Check package metadata
        run: python -m twine check --strict dist/*

      - name: Show distribution contents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          for path in sorted(Path("dist").iterdir()):
              print(f"\n=== {path.name} ===")

              if path.suffix == ".whl":
                  with zipfile.ZipFile(path) as archive:
                      for name in archive.namelist():
                          print(name)

              elif path.name.endswith(".tar.gz"):
                  with tarfile.open(path, "r:gz") as archive:
                      for member in archive.getnames():
                          print(member)
          PY

      - name: Reject generated/cache files in distributions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          forbidden = (
              "__pycache__/",
              ".pytest_cache/",
              ".coverage",
              ".pyc",
          )

          failures = []

          for path in Path("dist").iterdir():
              if path.suffix == ".whl":
                  with zipfile.ZipFile(path) as archive:
                      names = archive.namelist()
              elif path.name.endswith(".tar.gz"):
                  with tarfile.open(path, "r:gz") as archive:
                      names = archive.getnames()
              else:
                  continue

              for name in names:
                  if any(part in name for part in forbidden):
                      failures.append(f"{path.name}: {name}")

          if failures:
              raise SystemExit(
                  "Generated/cache files found in distributions:\n"
                  + "\n".join(failures)
              )
          PY

      - name: Test installed wheel
        shell: bash
        run: |
          python -m venv .venv-wheel
          . .venv-wheel/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python tools/release_artifact_smoke.py

      - name: Test installed sdist
        shell: bash
        run: |
          python -m venv .venv-sdist
          . .venv-sdist/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.tar.gz
          python tools/release_artifact_smoke.py

      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/algroots

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/algroots

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1