name: Extension fields
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  field-kernel:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    env:
      ALGROOTS_BUILD_NATIVE_F4: '1'
      ALGROOTS_BUILD_FF_SPARSE: '1'
      ALGROOTS_BUILD_NATIVE_EXTENSION: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/native-dependencies
      - run: python -m pip install build ".[test]"
      - run: python -m build --wheel
      - uses: ./.github/actions/repair-native-wheels
      - run: python -m pip install --force-reinstall --no-deps --no-index --find-links repaired algroots
      - name: Verify installed extended fields
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tools/wheel_smoke.py" --native --extension-fields --tutorials
      - run: python -m pytest -v tests/test_native_extension.py tests/test_native_parameter_fields.py tests/test_native_number_fields.py tests/test_native_mixed_fields.py tests/test_groebner_specialization.py tests/test_parameter_interpolation.py tests/test_native_field_robustness.py tests/test_parametric_rur.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: extension-wheels-${{ matrix.os }}-${{ matrix.python }}
          path: repaired/*.whl
