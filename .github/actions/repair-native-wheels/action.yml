name: Repair native wheels
description: Bundle native libraries before testing installed wheels.
runs:
  using: composite
  steps:
    - shell: bash
      run: python -m pip install "auditwheel; sys_platform == 'linux'" "patchelf; sys_platform == 'linux'" "delocate; sys_platform == 'darwin'" "delvewheel; sys_platform == 'win32'"
    - shell: bash
      run: python tools/repair_extension_wheels.py dist --output repaired
