name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && matrix.profile == 'native' && 60 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
        profile: [native, fallback]
    env:
      ALGROOTS_BUILD_NATIVE_F4: ${{ matrix.profile == 'native' && '1' || '0' }}
      ALGROOTS_BUILD_FF_SPARSE: ${{ matrix.profile == 'native' && '1' || '0' }}
      ALGROOTS_BUILD_NATIVE_EXTENSION: ${{ matrix.profile == 'native' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.profile == 'native'
        uses: ./.github/actions/native-dependencies
      - run: python -m pip install build "ruff==0.17.2" ".[test]"
      - run: python -m build --wheel
      - if: matrix.profile == 'native'
        uses: ./.github/actions/repair-native-wheels
      - run: python -m pip install --force-reinstall --no-deps --no-index --find-links ${{ matrix.profile == 'native' && 'repaired' || 'dist' }} algroots
      - name: Check installed wheel
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tools/wheel_smoke.py" ${{ matrix.profile == 'native' && '--native --extension-fields --stable-abi' || '' }} --tutorials
      - run: python tools/generate_api_signatures.py --check
      - run: python tools/run_test_profile.py ${{ matrix.profile == 'native' && '--native' || '' }} --verbose --junitxml=results.xml
      - run: ruff check src tests benchmarks tools setup.py
      - run: ruff format --check src tests benchmarks tools setup.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.profile }}
          path: |
            results.xml
            dist/*.whl
            repaired/*.whl
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dependencies: [minimum, latest]
        profile: [native, fallback]
    env:
      ALGROOTS_BUILD_NATIVE_F4: ${{ matrix.profile == 'native' && '1' || '0' }}
      ALGROOTS_BUILD_FF_SPARSE: ${{ matrix.profile == 'native' && '1' || '0' }}
      ALGROOTS_BUILD_NATIVE_EXTENSION: ${{ matrix.profile == 'native' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - if: matrix.profile == 'native'
        uses: ./.github/actions/native-dependencies
      - name: Install minimum dependencies
        if: matrix.dependencies == 'minimum'
        run: python -m pip install -c ci/minimum-dependencies.txt build ".[test]"
      - name: Install latest supported dependencies
        if: matrix.dependencies == 'latest'
        run: python -m pip install --upgrade --upgrade-strategy eager build ".[test]"
      - run: python -m pip freeze > dependency-versions.txt
      - run: python -m build
      - if: matrix.profile == 'native'
        uses: ./.github/actions/repair-native-wheels
      - run: python -m pip install --force-reinstall --no-deps --no-index --find-links ${{ matrix.profile == 'native' && 'repaired' || 'dist' }} algroots
      - name: Run installed tutorials
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tools/wheel_smoke.py" ${{ matrix.profile == 'native' && '--native --extension-fields --stable-abi' || '' }} --tutorials
      - run: python tools/run_test_profile.py ${{ matrix.profile == 'native' && '--native' || '' }} --verbose --junitxml=dependency-results.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dependencies-${{ matrix.dependencies }}-${{ matrix.profile }}
          path: |
            dependency-versions.txt
            dependency-results.xml
            dist/*
            repaired/*.whl
