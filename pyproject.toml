[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "algroots"
version = "0.1.0"
description = "Numerical and exact methods for zero-dimensional polynomial and algebraic systems"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Bhuvanesh Bhatt"}]
keywords = [
    "algebraic-equations",
    "polynomial-systems",
    "radicals",
    "rational-functions",
    "groebner-basis",
    "algebraic-geometry",
    "numerical-roots",
    "algebraic-numbers",
    "rational-univariate-representation",
    "border-basis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "sympy>=1.13,<2",
    "mpmath>=1.3,<2",
    "python-flint>=0.9,<1",
    "algrecognize>=0.1.1",
]

[project.urls]
Homepage = "https://github.com/BhuvaneshBhatt/algroots"
Documentation = "https://github.com/BhuvaneshBhatt/algroots/tree/main/docs"
Repository = "https://github.com/BhuvaneshBhatt/algroots.git"
Issues = "https://github.com/BhuvaneshBhatt/algroots/issues"
Changelog = "https://github.com/BhuvaneshBhatt/algroots/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "hypothesis>=6",
    "pytest-cov>=6",
]
dev = [
    "ruff>=0.12",
]
release = [
    "build>=1.2",
    "twine>=6",
]
benchmark = [
    "pytest>=8",
    "pytest-benchmark>=5.2",
]
mutation = [
    "mutmut>=3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/algroots"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "flint: requires the python-flint Arb/ACB backend",
    "slow: tests that are intentionally slower than the normal suite",
    "recognition: tests requiring real algrecognize/python-flint recognition",
]

[tool.ruff]
src            = ["src"]
target-version = "py311"
line-length = 100
exclude        = [".git", ".venv", ".pytest_cache", ".ruff_cache", "build", "docs", "dist", "notebooks", "README.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["algroots"]

[tool.coverage.report]
show_missing = true
precision = 1
fail_under = 80

[tool.mutmut]
source_paths = ["src/algroots/"]
pytest_add_cli_args_test_selection = ["tests/"]
mutate_only_covered_lines = true
